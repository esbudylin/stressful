[project]
name = "stressful"
version = "0.1.0"
description = "Dictionary + silero-stress ONNX accentuation for Russian"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "onnxruntime<1.24; python_version < '3.11'",
    "onnxruntime; python_version >= '3.11'",
]

[dependency-groups]
dev = [
    "parameterized==0.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["stressful"]
